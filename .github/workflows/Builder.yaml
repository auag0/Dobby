name: Android Builder

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  CMAKE_VERSION: 3.25.2
  LLVM_VERSION: 15.0.6
  NDK_VERSION: r25b

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
    - name: checkout master
      uses: actions/checkout@v3

    - name: setup cross compile environment
      run: |
        sh scripts/setup_linux_cross_compile.sh
        mkdir -p artifact
      shell: bash
    
    - name: compile android
      run: |
        python3 scripts/platform_builder.py --platform=android --arch=all --cmake_dir=$HOME/opt/cmake-$CMAKE_VERSION --llvm_dir=$HOME/opt/llvm-$LLVM_VERSION --android_ndk_dir=$HOME/opt/ndk-$NDK_VERSION
        cp include/dobby.h build/android
        tar -zcvf build/dobby-android-all.tar.gz build/android
        cp build/dobby-android-all.tar.gz artifact/
      shell: bash

    - name: list artifacts
      run: |
        echo "Generated artifacts:"
        ls -lh artifact/
        echo "Build directory contents:"
        ls -lh build/
      shell: bash

    - name: upload android build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dobby-android-build
        path: |
          artifact/dobby-android-all.tar.gz
          build/android/

    - name: upload raw build files
      uses: actions/upload-artifact@v3
      with:
        name: dobby-android-raw
        path: build/
